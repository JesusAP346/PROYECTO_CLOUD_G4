<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TELECLOUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo y título -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4">
                <i data-lucide="cloud" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">TELECLOUD</h1>
            <p class="text-gray-600">Inicia sesión para gestionar tus topologías</p>
        </div>

        <!-- Card de login -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Iniciar Sesión</h2>

            {% if error %}
            <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg flex items-start gap-3">
                <i data-lucide="alert-circle" class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5"></i>
                <p class="text-red-800 text-sm">{{ error }}</p>
            </div>
            {% endif %}

            {% if success %}
            <div class="mb-4 p-4 bg-green-50 border border-green-200 rounded-lg flex items-start gap-3">
                <i data-lucide="check-circle" class="w-5 h-5 text-green-600 flex-shrink-0 mt-0.5"></i>
                <p class="text-green-800 text-sm">{{ success }}</p>
            </div>
            {% endif %}

            <!-- Error message (dinámico con JavaScript) -->
            <div id="error-message" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg items-start gap-3 hidden">
                <i data-lucide="alert-circle" class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5"></i>
                <p id="error-text" class="text-red-800 text-sm"></p>
            </div>

            <form id="login-form">
                <!-- Username -->
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        Usuario
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="user" class="w-5 h-5 text-gray-400"></i>
                        </div>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                             class="pl-10 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                            placeholder="Usuario"
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Contraseña
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="w-5 h-5 text-gray-400"></i>
                        </div>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            class="pl-10 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                            placeholder="••••••••"
                        >
                    </div>
                </div>

                <!-- Submit button -->
                <button
                    type="submit"
                    id="login-btn"
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2"
                >
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    <span id="login-text">Iniciar Sesión</span>
                </button>
            </form>

            

            <!-- Link a registro -->
       <!--
           
            <div class="my-6 flex items-center">
                <div class="flex-1 border-t border-gray-300"></div>
                <span class="px-4 text-sm text-gray-500">o</span>
                <div class="flex-1 border-t border-gray-300"></div>
            </div>
            <div class="text-center">
                <p class="text-gray-600 text-sm">
                    ¿No tienes cuenta?
                    <a href="/register" class="text-indigo-600 hover:text-indigo-700 font-semibold">
                        Regístrate aquí
                    </a>
                </p>
            </div>
      
       
       -->    
            </div>

        
    </div>

    <script>
        lucide.createIcons();

        // Manejar el login con JWT
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const loginBtn = document.getElementById('login-btn');
            const loginText = document.getElementById('login-text');

            // Ocultar errores previos
            errorDiv.classList.add('hidden');

            // Deshabilitar botón y mostrar loading
            loginBtn.disabled = true;
            loginText.textContent = 'Iniciando sesión...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Guardar token en localStorage
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Redirigir al dashboard
                    window.location.href = '/dashboard';
                } else {
                    // Mostrar error
                    errorText.textContent = data.detail || 'Usuario o contraseña incorrectos';
                    errorDiv.classList.remove('hidden');
                    errorDiv.classList.add('flex');

                    // Rehabilitar botón
                    loginBtn.disabled = false;
                    loginText.textContent = 'Iniciar Sesión';
                }
            } catch (error) {
                console.error('Error:', error);
                errorText.textContent = 'Error de conexión. Verifica que el servidor esté corriendo.';
                errorDiv.classList.remove('hidden');
                errorDiv.classList.add('flex');

                // Rehabilitar botón
                loginBtn.disabled = false;
                loginText.textContent = 'Iniciar Sesión';
            }

            // Recrear iconos de Lucide
            lucide.createIcons();
        });
    </script>
</body>
</html>
